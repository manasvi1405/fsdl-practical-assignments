<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elite Fashion Store | Premium Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loginPage" class="vh-100 d-flex justify-content-center align-items-center login-bg">
  <div class="card p-5 shadow-lg login-card border-0 text-center">
    <h1 class="fw-bold mb-2">ELITE</h1>
    <p class="text-muted mb-4">Sophistication in every stitch.</p>
    <button class="btn btn-dark w-100 mb-3 py-3 fw-bold" onclick="showAdminLogin()">Admin Portal</button>
    <button class="btn btn-outline-dark w-100 py-3 fw-bold" onclick="userLogin()">Enter Store</button>

    <div id="adminLogin" class="mt-4 d-none animate-fade">
      <hr>
      <input id="adminUser" class="form-control mb-2 py-2" placeholder="Admin Username">
      <input id="adminPass" type="password" class="form-control mb-3 py-2" placeholder="Password">
      <button class="btn btn-gold w-100 py-2" onclick="adminLogin()">Authenticate</button>
    </div>
  </div>
</div>

<nav id="navbar" class="navbar navbar-expand-lg navbar-dark d-none sticky-top py-1">
  <div class="container">
    <span class="navbar-brand fs-3" onclick="showHome()" style="cursor:pointer">🛍 ELITE STORE</span>
    <div class="ms-auto d-flex align-items-center flex-wrap">
      <div class="d-flex align-items-center me-3 text-white">
        <label class="small me-2">Max: ₹<span id="priceLabel">15000</span></label>
        <input type="range" class="form-range" id="priceRange" min="0" max="15000" step="500" value="15000" oninput="updatePriceLabel(this.value)" style="width: 100px;">
      </div>
      <select id="categoryFilter" class="form-select bg-dark text-white border-secondary me-2" onchange="renderProducts()" style="width: auto;">
        <option value="">All Categories</option>
        <option>Fashion</option>
        <option>Footwear</option>
        <option>Accessories</option>
      </select>
      <button class="btn btn-outline-light position-relative me-3 border-0 fs-5" onclick="toggleCart()">
        <i class="bi bi-bag-heart"></i>
        <span id="cartCount" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" style="font-size: 0.6rem;">0</span>
      </button>
      <button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div id="heroSection" class="container mt-4 d-none animate-fade">
    <div id="promoCarousel" class="carousel slide shadow-lg rounded-4 overflow-hidden" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80" class="d-block w-100 carousel-img">
            <div class="carousel-caption">
              <h2 class="display-5 fw-bold text-uppercase">Exclusive Collection</h2>
              <button class="btn btn-gold px-4 py-2" onclick="document.getElementById('store').scrollIntoView()">Shop Now</button>
            </div>
          </div>
        </div>
    </div>
</div>

<div class="container mt-4 d-none" id="searchContainer">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="input-group shadow-sm rounded-pill overflow-hidden">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                <input id="searchInput" class="form-control border-0 py-3" placeholder="Search premium styles..." onkeyup="renderProducts()">
            </div>
        </div>
    </div>
</div>

<div id="adminPanel" class="container d-none mt-4 animate-fade">
  <div class="card p-4 border-0 shadow-sm mb-4 rounded-4">
    <h3 class="fw-bold mb-4" id="adminTitle"><i class="bi bi-plus-circle me-2"></i>Inventory Management</h3>
    <input type="hidden" id="editId">
    <div class="row g-3">
        <div class="col-md-4"><input id="pName" class="form-control" placeholder="Product Name"></div>
        <div class="col-md-4"><input id="pImg" class="form-control" placeholder="Image URL"></div>
        <div class="col-md-2">
            <select id="pCat" class="form-select">
                <option value="Fashion">Fashion</option>
                <option value="Footwear">Footwear</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>
        <div class="col-md-1"><input id="pPrice" class="form-control" placeholder="₹"></div>
        <div class="col-md-1"><input id="pQty" class="form-control" placeholder="Qty"></div>
    </div>
    <div class="mt-3">
        <button id="addBtn" class="btn btn-dark px-5 py-2" onclick="addProduct()">Add to Inventory</button>
        <button id="updateBtn" class="btn btn-success d-none px-5 py-2" onclick="updateProduct()">Update Product</button>
        <button id="cancelBtn" class="btn btn-link text-muted d-none" onclick="resetAdminForm()">Cancel</button>
    </div>
  </div>
  <div class="row" id="adminProducts"></div>
</div>

<div id="store" class="container mt-5 d-none animate-fade">
  <div class="row" id="productList"></div>
</div>

<div id="cartPage" class="container mt-5 d-none animate-fade">
  <div class="card p-5 border-0 shadow-lg rounded-4">
      <h2 class="fw-bold border-bottom pb-3 mb-4">Shopping Bag</h2>
      <div id="cartItems" class="py-3"></div>
      <div class="d-flex justify-content-between align-items-center mt-4">
          <h3 class="fw-bold text-primary">Total: ₹<span id="cartTotal">0</span></h3>
          <button class="btn btn-gold btn-lg px-5 py-3 rounded-pill fw-bold" onclick="showCheckout()">Checkout</button>
      </div>
  </div>
</div>

<div id="checkoutModal" class="modal-overlay d-none">
    <div class="modal-card p-5 shadow-lg text-center">
        <div id="checkoutForm">
            <h3 class="fw-bold mb-3">Delivery Details</h3>
            <input type="text" id="custName" class="form-control mb-3 py-2" placeholder="Full Name">
            <input type="text" id="custPhone" class="form-control mb-3 py-2" placeholder="Phone">
            <textarea id="custAddr" class="form-control mb-3" placeholder="Address" rows="3"></textarea>
            <button class="btn btn-dark w-100 py-3 rounded-pill fw-bold" onclick="processOrder()">Order Now</button>
            <button class="btn btn-link text-muted mt-2" onclick="hideCheckout()">Back</button>
        </div>
        <div id="successMsg" class="d-none">
            <h2 class="text-success fw-bold">Order Confirmed!</h2>
            <button class="btn btn-dark w-100 py-3 rounded-pill mt-4" onclick="returnToHomeFromSuccess()">Home</button>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-5 mt-5 d-none" id="mainFooter">
    <p class="mb-0">Defining style since 2024. &copy; 2026 Elite Store.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
